    <stop offset="55%" stop-color="#110e22"/>
    <stop offset="100%" stop-color="#09090f"/>
  </linearGradient>
  <linearGradient id="konRing" x1="20%" y1="0%" x2="80%" y2="100%">
    <stop offset="0%" stop-color="#18b8ff"/>
    <stop offset="50%" stop-color="#7c4dff"/>
    <stop offset="100%" stop-color="#e000ff"/>
  </linearGradient>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="50%" stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#ff2d6f"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="32" result="b"/>
    <feFlood flood-color="#a855f7" flood-opacity="0.8"/>
    <feComposite in2="b" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
