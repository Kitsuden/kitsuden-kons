<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 744" width="1200" height="744" role="img" aria-labelledby="t d">
<title id="t">kitsuden-kons — 34 kons</title>
<desc id="d">The 34 kons for Kitsuden, grouped by category: core (blog, members), business (academy-lms, agile, booking, conta, crm, directory, dms, ecommerce, koe, listings, odoo, payments), content and community (analytics, comments, newsletter, wiki, chat, dc), gaming (autobattler, broadcast, cardsim, character-builder, collection, esports, formulas, games, maps, streamers, tierlist), documents and ocr (ingest, ocr-training, vekstudio). Solid means stable, outlined beta, dashed experimental.</desc>
