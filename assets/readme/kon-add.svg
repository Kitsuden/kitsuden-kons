<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">What installing a kon adds to a Kitsuden backend</title>
<desc id="d">Animation. In a Kitsuden folder, the command pnpm kitsuden kon add blog --from ../kitsuden-kons copies the kon to packages/kons/kon-blog, installs its dependencies and applies its migrations. After restarting the API the backend has 5 new tables with row security, a REST API under /api/blog documented in OpenAPI, the kon's operations as MCP tools at /api/mcp, its own scopes for each agent key, and 6 admin panel views for setup and oversight.</desc>
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes k0{0%,2.99%{opacity:0}3%,96%{opacity:1}97.5%,100%{opacity:0}}@keyframes k1{0%,13.99%{opacity:0}14%,96%{opacity:1}97.5%,100%{opacity:0}}@keyframes k2{0%,21.99%{opacity:0}22%,96%{opacity:1}97.5%,100%{opacity:0}}@keyframes k3{0%,29.99%{opacity:0}30%,96%{opacity:1}97.5%,100%{opacity:0}}@keyframes k4{0%,39.99%{opacity:0}40%,96%{opacity:1}97.5%,100%{opacity:0}}@keyframes k5{0%,30.99%{opacity:0}31%,96%{opacity:1}97.5%,100%{opacity:0}}@keyframes k6{0%,44.99%{opacity:0}45%,96%{opacity:1}97.5%,100%{opacity:0}}@keyframes k7{0%,52.99%{opacity:0}53%,96%{opacity:1}97.5%,100%{opacity:0}}@keyframes k8{0%,60.99%{opacity:0}61%,96%{opacity:1}97.5%,100%{opacity:0}}@keyframes k9{0%,68.99%{opacity:0}69%,96%{opacity:1}97.5%,100%{opacity:0}}@keyframes k10{0%,0.99%{opacity:0}1%,38%{opacity:1}39.5%,100%{opacity:0}}@keyframes k11{0%,39.99%{opacity:0}40%,96%{opacity:1}97.5%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="1" y="1" width="1198" height="418" rx="28" fill="#0f1520" stroke="#2a3446" stroke-width="2"/>
<line x1="612" y1="34" x2="612" y2="348" stroke="#2a3446" stroke-width="2"/>
<line x1="56" y1="364" x2="1144" y2="364" stroke="#2a3446" stroke-width="2"/>
<text class="s" x="56" y="66" font-size="18" font-weight="700" fill="#f1f5f9">In your Kitsuden folder</text>
<text class="s" x="640" y="66" font-size="18" font-weight="700" fill="#f1f5f9">What your backend has now</text>
<g style="opacity:1;animation:k0 14s linear infinite"><text class="m" x="56" y="112" font-size="15" fill="#7ab4ff">$ pnpm kitsuden kon add blog --from ../kitsuden-kons</text></g>
<g style="opacity:1;animation:k1 14s linear infinite"><rect x="56" y="135" width="3" height="24" fill="#34d399"/><text class="m" x="72" y="152" font-size="16" fill="#f1f5f9">copied to packages/kons/kon-blog</text></g>
<g style="opacity:1;animation:k2 14s linear infinite"><rect x="56" y="173" width="3" height="24" fill="#34d399"/><text class="m" x="72" y="190" font-size="16" fill="#f1f5f9">dependencies installed</text></g>
<g style="opacity:1;animation:k3 14s linear infinite"><rect x="56" y="211" width="3" height="24" fill="#34d399"/><text class="m" x="72" y="228" font-size="16" fill="#f1f5f9">migrations applied</text></g>
<g style="opacity:1;animation:k4 14s linear infinite"><text class="m" x="56" y="270" font-size="16" fill="#a8b3c4">restart the API</text></g>
<rect x="640" y="92" width="504" height="44" rx="9" fill="none" stroke="#2a3446" stroke-width="2"/><text class="s" x="660" y="120" font-size="15" font-weight="600" fill="#a8b3c4">Tables</text><g style="opacity:1;animation:k5 14s linear infinite"><rect x="640" y="92" width="504" height="44" rx="9" fill="#161e2c" stroke="#34d399" stroke-width="2"/><text class="s" x="660" y="120" font-size="15" font-weight="600" fill="#f1f5f9">Tables</text><text class="m" x="776" y="120" font-size="14" fill="#f1f5f9">5 tables, with row security</text></g>
<rect x="640" y="144" width="504" height="44" rx="9" fill="none" stroke="#2a3446" stroke-width="2"/><text class="s" x="660" y="172" font-size="15" font-weight="600" fill="#a8b3c4">REST API</text><g style="opacity:1;animation:k6 14s linear infinite"><rect x="640" y="144" width="504" height="44" rx="9" fill="#161e2c" stroke="#34d399" stroke-width="2"/><text class="s" x="660" y="172" font-size="15" font-weight="600" fill="#f1f5f9">REST API</text><text class="m" x="776" y="172" font-size="14" fill="#f1f5f9">/api/blog/…  in OpenAPI</text></g>
<rect x="640" y="196" width="504" height="44" rx="9" fill="none" stroke="#2a3446" stroke-width="2"/><text class="s" x="660" y="224" font-size="15" font-weight="600" fill="#a8b3c4">MCP tools</text><g style="opacity:1;animation:k7 14s linear infinite"><rect x="640" y="196" width="504" height="44" rx="9" fill="#161e2c" stroke="#34d399" stroke-width="2"/><text class="s" x="660" y="224" font-size="15" font-weight="600" fill="#f1f5f9">MCP tools</text><text class="m" x="776" y="224" font-size="14" fill="#f1f5f9">its operations, at /api/mcp</text></g>
<rect x="640" y="248" width="504" height="44" rx="9" fill="none" stroke="#2a3446" stroke-width="2"/><text class="s" x="660" y="276" font-size="15" font-weight="600" fill="#a8b3c4">Permissions</text><g style="opacity:1;animation:k8 14s linear infinite"><rect x="640" y="248" width="504" height="44" rx="9" fill="#161e2c" stroke="#34d399" stroke-width="2"/><text class="s" x="660" y="276" font-size="15" font-weight="600" fill="#f1f5f9">Permissions</text><text class="m" x="776" y="276" font-size="14" fill="#f1f5f9">its own scopes per agent key</text></g>
<rect x="640" y="300" width="504" height="44" rx="9" fill="none" stroke="#2a3446" stroke-width="2"/><text class="s" x="660" y="328" font-size="15" font-weight="600" fill="#a8b3c4">Panel</text><g style="opacity:1;animation:k9 14s linear infinite"><rect x="640" y="300" width="504" height="44" rx="9" fill="#161e2c" stroke="#34d399" stroke-width="2"/><text class="s" x="660" y="328" font-size="15" font-weight="600" fill="#f1f5f9">Panel</text><text class="m" x="776" y="328" font-size="14" fill="#f1f5f9">6 views for setup and oversight</text></g>
<g style="opacity:0;animation:k10 14s linear infinite"><text class="s" x="56" y="398" font-size="19" fill="#f1f5f9">One command copies the kon, installs it and runs its migrations.</text></g>
<g style="opacity:1;animation:k11 14s linear infinite"><text class="s" x="56" y="398" font-size="19" fill="#f1f5f9">After a restart your backend has a blog: API, MCP tools, permissions and panel views.</text></g>
</svg>
