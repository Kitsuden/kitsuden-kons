<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Standings — Round Robin</title>
    <!--
      Group standings table for OBS. 1920×1080 Browser Source:

        /api/kons/kon-broadcast/graphics/standings.html?tournament=<id>

      Same model as the Top 8: polling on the public endpoint, no
      WebSocket — standings change set by set, not second by second.
    -->
    <style>
      :root {
        --a: #00d2a8;
        --ink: #f2f5fa;
        --ink-dim: #8d96a8;
        --ink-faint: #59606f;
        --surface: rgba(7, 10, 16, 0.92);
        --hairline: rgba(255, 255, 255, 0.1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }

      body:not([data-ready]) .board {
        opacity: 0;
      }

      .board {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        min-width: 860px;
        background: var(--surface);
        backdrop-filter: blur(6px);
        padding: 40px 52px;
        transition: opacity 200ms ease;
      }

      .head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        border-bottom: 1px solid var(--hairline);
        padding-bottom: 14px;
        margin-bottom: 8px;
      }

      .title {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.05em;
      }

      .subtitle {
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-faint);
        font-weight: 600;
        text-align: right;
        padding: 10px 14px;
      }

      th.who {
        text-align: left;
      }

      td {
        padding: 11px 14px;
        font-size: 17px;
        text-align: right;
        border-top: 1px solid var(--hairline);
      }

      td.pos {
        color: var(--ink-faint);
        font-size: 14px;
        width: 40px;
      }

      td.who {
        text-align: left;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      td.record {
        font-family: ui-monospace, monospace;
      }

      td.diff[data-positive="1"] {
        color: var(--a);
      }

      /* The advancement zone is marked with a hairline, not with party colors. */
      tr[data-advances="1"] td.pos {
        color: var(--a);
        font-weight: 800;
      }
    </style>
  </head>

  <body>
    <div class="board">
      <div class="head">
        <span class="title" data-title></span>
        <span class="subtitle" data-subtitle></span>
      </div>
      <table>
        <thead>
          <tr>
            <th></th>
            <th class="who">Player</th>
            <th>P</th>
            <th>W</th>
            <th>L</th>
            <th>Diff.</th>
          </tr>
        </thead>
        <tbody data-rows></tbody>
      </table>
    </div>

    <script type="module" src="./standings.js"></script>
  </body>
</html>
